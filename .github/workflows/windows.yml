# The suite on Windows: every ingest, export and serve there runs in winbox's AppContainer,
# and test_winbox/test_gui only run here.
name: windows
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - uses: actions/cache/restore@v4
        id: models
        with:  # GLiNER (Hugging Face) and Docling's layout and RapidOCR models
          path: |
            ~/.cache/huggingface
            ~/.cache/docling
          key: models-${{ hashFiles('src/mcp_secret/pii.py', 'uv.lock') }}
      - run: uv run mcp-secret models
      - uses: actions/cache/save@v4  # now, not after the job: a failing test still keeps them
        if: steps.models.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/docling
          key: ${{ steps.models.outputs.cache-primary-key }}
      - run: uv run ruff check
      - run: uv run pytest -rs --tb=short
        env:
          MCP_SECRET_DEBUG: 1  # a failed file prints its frames and the path an OSError names
